<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring" x1="8" y1="52" x2="56" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#112da3"/>
      <stop offset=".55" stop-color="#205ca3"/>
      <stop offset="1" stop-color="#2cc4f4"/>
    </linearGradient>
    <radialGradient id="core" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#7fe0ff"/>
      <stop offset=".45" stop-color="#22b7ef"/>
      <stop offset="1" stop-color="#1449a8"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22b7ef" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22b7ef" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="15" fill="#04050d"/>

  <!-- orbit ring -->
  <g transform="rotate(-28 32 32)">
    <ellipse cx="32" cy="32" rx="24" ry="10" fill="none"
             stroke="url(#ring)" stroke-width="3.2" stroke-linecap="round"/>
    <ellipse cx="32" cy="32" rx="24" ry="10" fill="none"
             stroke="#2cc4f4" stroke-width="3.2" stroke-linecap="round"
             stroke-dasharray="26 125" stroke-dashoffset="-18" opacity=".9"/>
  </g>

  <!-- glow + core -->
  <circle cx="32" cy="32" r="17" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="10" fill="url(#core)"/>

  <!-- satellite -->
  <circle cx="13.7" cy="45.6" r="3.4" fill="#eaf7ff"/>
  <circle cx="13.7" cy="45.6" r="3.4" fill="none" stroke="#22b7ef" stroke-width="1" opacity=".6"/>
</svg>
